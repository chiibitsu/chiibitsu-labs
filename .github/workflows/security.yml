name: security
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    # Pin a SHA, never a branch. Keep the `# main` hint: Renovate needs it to know what to bump.
    uses: Chiibitsu-Labs/security-checks/.github/workflows/security.yml@58a85e8aa928eb43c92ccea810637d77b38a0908 # main
    with:
      codeql: true
